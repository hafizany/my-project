<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>NETWORK PROJECT MANAGEMENT SYSTEM</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* Pelarasan automatik untuk bar pelayar telefon pintar */
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbz-ITnZTgiiSlbCji5pnkNIvOUpR6GkI82_Jhqd3u3FcSxJ3EI1GgHRO4VYSlAmxyQ/exec" 
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>
</body>
</html>
